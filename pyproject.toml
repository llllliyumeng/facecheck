[project]
name = "facecheck"
version = "0.1.0"
description = "Privacy-preserving portrait video storage prototype"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "gmssl>=3.2,<4.0",
    "opencv-python-headless>=4.10,<5.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

